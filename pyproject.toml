[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "utterpy"
version = "0.0.5"
description = "Python bindings for utter, the zero-dependency pure-Rust streaming speech decoder for Vosk (Kaldi nnet3) models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]

[tool.maturin]
features = ["pyo3/extension-module"]
# The compiled module sits inside the package so py.typed and the stub ship beside it.
module-name = "utterpy._utterpy"
python-source = "python"
# The sdist is what builds the wheel, not the repository's tooling.
exclude = [
  ".github/**",
  "docs/**",
  "tests/**",
  ".*",
  "deny.toml",
  "ruff.toml",
  "CODE_OF_CONDUCT.md",
  "CONTRIBUTING.md",
  "GOVERNANCE.md",
  "ROADMAP.md",
  "SECURITY.md",
]

[tool.mypy]
# The floor in requires-python, not whichever interpreter CI happens to run mypy on.
python_version = "3.9"
# AcceptWaveform downcasts to bytes, so the stub's bytes must not absorb memoryview.
strict_bytes = true
