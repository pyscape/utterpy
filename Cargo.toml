[package]
name = "utterpy"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "Python bindings for utter, the zero-dependency pure-Rust streaming speech decoder for Vosk (Kaldi nnet3) models"
repository = "https://github.com/pyscape/utterpy"

[lib]
name = "utterpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
utter = "0.0.1"


[profile.release]
opt-level = 3

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Backticks in docs only where the bare form breaks, so the lint that demands them is off.
doc_markdown = "allow"
