name: Wheels

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    # The wheel's version is the utter crate's; a binding-only fix is a post-release of it. The
    # tag is the pyproject version, and its base is both the Cargo version and the pinned crate's.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: rustup toolchain install
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%.post*}"
          py=$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          rs=$(python3 -c 'import tomllib;print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          core=$(cargo metadata --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "utter" and .source != null) | .version')
          echo "tag=$tag pyproject=$py Cargo=$rs utter=$core"
          [ "$tag" = "$py" ] && [ "$base" = "$rs" ] && [ "$base" = "$core" ]
      - name: The release notes for this tag exist, and the changelog has its section
        run: |
          test -s "docs/release-notes/${GITHUB_REF_NAME}.md"
          grep -qx "## ${GITHUB_REF_NAME#v}" CHANGELOG.md
      - name: The tag is signed by a key GitHub knows for the maintainer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq .object.sha)
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/$sha" --jq '.verification | "\(.verified) \(.reason)"' \
            | tee /dev/stderr | grep -q '^true '

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: The toolchain rust-toolchain.toml pins, with its components
        run: rustup toolchain install
      - name: The crate builds on the rust-version the manifest promises
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check --all-targets
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
      - name: No build artefacts are tracked
        run: |
          ! git ls-files | grep -E '(^|/)__pycache__/|\.pyc$|(^|/)target/|(^|/)dist/'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r .github/requirements/lint.txt
      - run: ruff check python tests && ruff format --check python tests
      - name: Install the module so the type checks resolve it
        run: pip install .
      - run: mypy --strict tests
      - run: python -m mypy.stubtest utterpy
      - uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53  # v1.50.2
      - run: yamllint --strict .
      - run: npx --yes markdownlint-cli2@0.23.2
      - run: |
          npx --yes @taplo/cli@0.7.0 lint '**/*.toml'
          npx --yes @taplo/cli@0.7.0 fmt --check '**/*.toml'
      - name: Workflows lint, their shell through shellcheck
        run: |
          curl -sfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" \
            | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color

  linux:
    runs-on: ${{ matrix.target == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
        libc: [manylinux, musllinux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.9.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: ${{ matrix.libc == 'musllinux' && 'musllinux_1_2' || '2_28' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke test
        if: matrix.libc == 'manylinux'
        run: |
          python -m pip install --no-index --find-links dist utterpy
          python tests/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: dist

  test:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wheels-linux-x86_64-manylinux
          path: dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        id: model
        with:
          path: models
          key: vosk-model-small-en-us-0.15+vosk-model-spk-0.4
      - if: steps.model.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          for name in vosk-model-small-en-us-0.15 vosk-model-spk-0.4; do
            curl -sSL -o model.zip "https://alphacephei.com/vosk/models/$name.zip"
            unzip -q model.zip -d models
          done
      - run: |
          python -m pip install --no-index --find-links dist utterpy
          python -m pip install "pytest<9"
          python -m pytest -q tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.9.0
        with:
          target: x64
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist utterpy
          python tests/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-windows-x64
          path: dist

  windows-arm:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.9.0
        with:
          target: aarch64
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke test
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist utterpy
          python tests/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-windows-aarch64
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.9.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke test
        run: |
          python -m pip install --no-index --find-links dist utterpy
          python tests/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.9.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: The sdist carries what PyPI checks and what a build from it needs
        run: |
          pip install --require-hashes -r .github/requirements/release.txt
          twine check --strict dist/*
          rustup toolchain install
          python -m venv from-sdist
          from-sdist/bin/pip install dist/*.tar.gz
          from-sdist/bin/python tests/smoke.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sdist
          path: dist

  release:
    # Runs on a version tag only. Publishing uses PyPI trusted publishing: the project on PyPI
    # must list this repository and workflow as a publisher; no token is stored here. Until it
    # does, the repository variable PYPI_PUBLISH is unset and the tag makes the GitHub release only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, lint, test, linux, windows, windows-arm, macos, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Provenance for every wheel and the sdist, verifiable with `gh attestation verify`
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      # The bundle rides with the release so a consumer verifies offline with --bundle and
      # Scorecard's Signed-Releases sees the release as signed; its DSSE envelope, the signed
      # in-toto statement, rides beside it under the name tooling reads as provenance. One
      # attestation names every file; the action would write one bundle per line if it made several.
      - name: The Sigstore bundle and its provenance envelope beside the wheels
        run: |
          test "$(jq -c . "${{ steps.attest.outputs.bundle-path }}" | wc -l)" = 1
          jq . "${{ steps.attest.outputs.bundle-path }}" > "utterpy-${GITHUB_REF_NAME}.sigstore.json"
          jq -c .dsseEnvelope "${{ steps.attest.outputs.bundle-path }}" > "utterpy-${GITHUB_REF_NAME}.intoto.jsonl"
      - name: GitHub release with the wheels attached
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          files: |
            dist/*
            utterpy-${{ github.ref_name }}.sigstore.json
            utterpy-${{ github.ref_name }}.intoto.jsonl
          body_path: docs/release-notes/${{ github.ref_name }}.md
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # A rerun of a tag whose wheels PyPI already holds refreshes the GitHub release only.
          skip-existing: true
